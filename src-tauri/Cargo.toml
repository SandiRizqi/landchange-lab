[package]
name = "landchange-lab"
version = "1.0.0"
description = "LandChange Lab — Land Change Detection Labeling Tool"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
image             = { version = "0.25", features = ["tiff", "png", "jpeg", "bmp"] }
base64            = "0.22"

[profile.release]
panic   = "abort"
codegen-units = 1
opt-level = "s"
lto = true
strip = true
